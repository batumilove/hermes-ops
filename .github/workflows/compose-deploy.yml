name: Reusable Compose deployment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment and Hermes deployment environment
        required: true
        type: string
      operation:
        description: deploy or rollback
        required: true
        type: string
      image_digest:
        description: Exact immutable target sha256 image digest
        required: true
        type: string
      source_sha:
        description: Full source commit SHA recorded in deployment evidence
        required: true
        type: string
      ops_sha:
        description: Exact hermes-ops commit containing reviewed deployment tooling
        required: true
        type: string
    secrets:
      TAILSCALE_AUTHKEY:
        description: Scoped, reusable, ephemeral Tailscale auth key fallback
        required: false
      TAILSCALE_OAUTH_CLIENT_ID:
        required: false
      TAILSCALE_OAUTH_SECRET:
        required: false
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_OPERATION: ${{ inputs.operation }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      OPS_SHA: ${{ inputs.ops_sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      TAILSCALE_TAGS: ${{ vars.TAILSCALE_TAGS }}
      IMAGE_REPOSITORY: ghcr.io/batumilove/hermes-agent-deploy
    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ENVIRONMENT" =~ ^batumi-(staging|production)$ ]]
          [[ "$DEPLOY_OPERATION" =~ ^(deploy|rollback)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$TAILSCALE_TAGS" =~ ^tag:[A-Za-z0-9,_:-]+$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Join the deployment tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ env.TAILSCALE_TAGS }}
          hostname: gha-hermes-${{ inputs.environment }}-${{ github.run_id }}

      - name: Configure pinned SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Apply release through installed host controller
        shell: bash
        run: |
          set -euo pipefail
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )

          controller="github-actions:compose-deploy:${GITHUB_RUN_ID}"
          actor=${GITHUB_ACTOR//[^A-Za-z0-9_.@-]/-}
          authorization="github:${actor}"
          remote_args=(
            sudo -n /usr/local/libexec/hermes-deployment-controller apply
            "$DEPLOY_ENVIRONMENT" "$DEPLOY_OPERATION" "$IMAGE_REPOSITORY"
            "$IMAGE_DIGEST" "$SOURCE_SHA" "$controller" "$authorization"
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          )
          printf -v remote_command '%q ' "${remote_args[@]}"
          # remote_command is locally built with printf %q for remote parsing.
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" "$remote_command"
